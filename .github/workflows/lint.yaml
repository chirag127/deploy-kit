name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform fmt check
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: helm lint
        run: helm lint charts/deploy-kit-app

  kustomize:
    name: kustomize build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install kustomize
        uses: imranismail/setup-kustomize@v3

      - name: build base
        run: kustomize build k8s/base

      - name: build dev overlay
        run: kustomize build k8s/overlays/dev

      - name: build prod overlay
        run: kustomize build k8s/overlays/prod

  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: install kustomize
        uses: imranismail/setup-kustomize@v3

      - name: validate base manifests
        run: |
          kustomize build k8s/base | kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -kubernetes-version 1.32.0

      - name: validate dev overlay
        run: |
          kustomize build k8s/overlays/dev | kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -kubernetes-version 1.32.0

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install yamllint
        run: pip install yamllint

      - name: yamllint
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 120}}}' \
            k8s/ gitops/ observability/ charts/deploy-kit-app/Chart.yaml charts/deploy-kit-app/values.yaml

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          tags: ghcr.io/chirag127/deploy-kit-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
