apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deploy-kit-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploy-kit-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "deploy-kit-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deploy-kit-app.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.PORT | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "deploy-kit-app.fullname" . }}
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploy-kit-app.fullname" . }}
                  key: API_KEY
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "deploy-kit-app.selectorLabels" . | nindent 14 }}
