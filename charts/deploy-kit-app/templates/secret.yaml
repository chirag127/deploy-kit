apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deploy-kit-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploy-kit-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  API_KEY: {{ .Values.secrets.API_KEY | quote }}
