apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deploy-kit-app
  namespace: deploy-kit
  labels:
    app.kubernetes.io/name: deploy-kit-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: deploy-kit-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from nginx-ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow Prometheus scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS (for any external calls)
    - ports:
        - protocol: TCP
          port: 443
