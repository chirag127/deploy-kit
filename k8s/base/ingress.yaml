apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deploy-kit-app
  namespace: deploy-kit
  labels:
    app.kubernetes.io/name: deploy-kit-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: deploy-kit.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deploy-kit-app
                port:
                  name: http
