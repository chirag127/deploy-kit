apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: deploy-kit

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: deploy-kit
    includeSelectors: false
    includeTemplates: true

images:
  - name: ghcr.io/chirag127/deploy-kit-app
    newTag: latest
