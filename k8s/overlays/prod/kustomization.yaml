apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: deploy-kit-prod

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: deploy-kit-app
        namespace: deploy-kit
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: app
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi

  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: deploy-kit-app
        namespace: deploy-kit
      spec:
        minReplicas: 3
        maxReplicas: 20

  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: deploy-kit-app
        namespace: deploy-kit
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          cert-manager.io/cluster-issuer: letsencrypt-prod
      spec:
        ingressClassName: nginx
        tls:
          - hosts:
              - deploy-kit.oriz.in
            secretName: deploy-kit-tls
        rules:
          - host: deploy-kit.oriz.in
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: deploy-kit-app
                      port:
                        name: http

  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: deploy-kit-app
        namespace: deploy-kit
      data:
        ENV: prod

images:
  - name: ghcr.io/chirag127/deploy-kit-app
    newTag: "1.0.0"
