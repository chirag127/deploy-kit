apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: deploy-kit

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: deploy-kit-app
        namespace: deploy-kit
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: app
                resources:
                  requests:
                    cpu: 25m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi

  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: deploy-kit-app
        namespace: deploy-kit
      spec:
        minReplicas: 1
        maxReplicas: 3

  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: deploy-kit-app
        namespace: deploy-kit
      data:
        ENV: dev

images:
  - name: ghcr.io/chirag127/deploy-kit-app
    newTag: dev
