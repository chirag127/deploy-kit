apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploy-kit-app-helm
  namespace: argocd
  labels:
    app.kubernetes.io/name: deploy-kit-app
    app.kubernetes.io/part-of: deploy-kit
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/chirag127/deploy-kit.git
    targetRevision: HEAD
    path: charts/deploy-kit-app
    helm:
      releaseName: deploy-kit-app
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: "1.0.0"
        - name: config.ENV
          value: "prod"

  destination:
    server: https://kubernetes.default.svc
    namespace: deploy-kit-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 3
